[package]
name = "toneforge"
version = "0.1.0"
description = "ToneForge - modern guitar amp editor"
authors = ["Solrak97"]
edition = "2021"

[lib]
name = "toneforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toneforge-core = { workspace = true }
toneforge-devices = { workspace = true }
