[workspace]
members = [
    "src-tauri",
    "crates/toneforge-core",
    "crates/toneforge-devices",
    "crates/toneforge-library",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
midir = "0.10"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
toneforge-core = { path = "crates/toneforge-core" }
toneforge-devices = { path = "crates/toneforge-devices" }
toneforge-library = { path = "crates/toneforge-library" }
